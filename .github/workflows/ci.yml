name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: this workflow only checks out, builds, tests and uploads an
# artifact (upload-artifact uses the runtime token, not `contents: write`).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (macOS, Swift 6)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Lint (swift-format)
        run: swift format lint --strict --recursive --configuration .swift-format Sources Tests Package.swift

      - name: Cask sanity (brew style)
        run: brew style Casks/decaffeinate.rb

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      - name: Smoke-test the scanner
        run: swift run Decaffeinate --scan

      - name: Build the .app bundle
        run: ./Scripts/build-app.sh

      # The design gates in `swift test` check values in source. This checks that
      # every surface still renders — and, uploaded, lets a human look at the
      # result, which is the step that actually catches a visual regression.
      - name: Render the UI screenshots
        run: swift run Decaffeinate --screenshots "$RUNNER_TEMP/screenshots"

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          retention-days: 14
